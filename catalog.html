<!DOCTYPE html>
<html>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <title>Catalog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .catalog {
            padding: 50px 20px;
            text-align: center;
            background-color: #f9f9f9;
        }
        .catalog h2 {
            margin-bottom: 40px;
            font-size: 36px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
        .product-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 200px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .product-card h3 {
            margin: 15px 0 10px;
            font-size: 20px;
        }
        .product-card p {
            margin: 5px 0;
            color: #555;
        }
        .product-card button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .product-card button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<section class="catalog">

            <p>Price: 50 cedis</p>
                       <h1> <a href="cart.html">
            <button>Order Now</button></a></h1>
        </div>
        <div class="product-card">
            <img src="photos/NEXT Blue Relaxed Fit Heavyweight T-Shirt Medium Mens.jpg" alt="Blue T-Shirt">
            <h3>Blue T-Shirt</h3>
            <p>Sizes: S, M, L, XL</p>
            <p>Price: 50 cedis</p>
           <h1> <a href="cart.html">
            <button>Order Now</button></a></h1>
